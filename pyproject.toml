[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eforensics"
version = "0.1.0"
description = "Emotion-probe ensembles for predicting model misbehaviour without chain-of-thought (Qwen3.6-27B / Qwen3.8-27B)"
requires-python = ">=3.10"
# CPU-side core: config, task manifests, labels, features, predictors, evaluation. The GPU
# stacks (torch, transformers, vLLM) are installed from requirements/*.txt on the pod.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "tqdm",
  "python-dotenv",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
judge = ["openai>=1.40", "anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
